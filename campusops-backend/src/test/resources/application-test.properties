# Test profile: use an embedded H2 database so the Spring context can start in CI
# without a local PostgreSQL service.
spring.datasource.url=jdbc:h2:mem:campusops_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Minimal values required during application startup in tests.
application.security.jwt.secret-key=test-ci-jwt-secret
application.security.jwt.expiration=86400000
application.security.admin.default-password=test-admin-password

# Avoid external mail traffic during automated tests.
campusops.mail.enabled=false

# Keep test startup deterministic and independent from local developer config.
spring.config.import=optional:file:./secrets.properties
