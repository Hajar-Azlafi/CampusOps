# ============================================================================
#  Profil de test « test » — utilise par les tests qui demarrent le contexte
#  Spring (@SpringBootTest). Objectif : demarrer le contexte SANS dependre d'un
#  service PostgreSQL externe (aucune base n'est disponible sur un runner CI
#  isole), et sans executer les seeders (qui manipulent des donnees metier
#  complexes et des specificites PostgreSQL).
#
#  Base : H2 en memoire, en mode « PostgreSQL » pour rester compatible avec la
#  syntaxe SQL/SQL-dialect utilisee par les entites.
# ============================================================================
spring.datasource.url=jdbc:h2:mem:campusops_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Le schema est cree au demarrage puis detruit a la fin : base ephemere.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 ne supporte pas « SET client_encoding TO 'UTF8' » (specifique PostgreSQL) :
# on neutralise la commande d'init Hikari pour eviter une erreur au demarrage.
spring.datasource.hikari.connection-init-sql=

# ===== Valeurs minimales requises au demarrage =====
application.security.jwt.secret-key=test-ci-jwt-secret-key-256-bits-minimum-length-required-here
application.security.jwt.expiration=86400000
application.security.admin.email=admin@campusops.ma
application.security.admin.default-password=test-admin-password
campusops.seed.responsables-password=test-responsable-password

# Fuseau horaire deterministe en test.
campusops.app.timezone=Africa/Casablanca
spring.jackson.time-zone=Africa/Casablanca

# ===== Desactivation de TOUS les seeders au demarrage du contexte =====
# Les seeders peuplent la base avec des donnees metier et dependent de
# specificites PostgreSQL. En test, on veut un contexte qui demarre vite et de
# facon deterministe : aucun seeder ne doit s'executer.
campusops.seed.settings=false
campusops.seed.reset-reference-data=false
campusops.seed.academic-structure=false
campusops.seed.cleanup-legacy-semesters=false
campusops.seed.cleanup-legacy-time-slots=false
campusops.seed.semester-courant=false
campusops.seed.responsables=false
campusops.seed.responsables-per-filiere=false
campusops.seed.academic-sessions=false
campusops.seed.timetables=false
campusops.seed.modules=false
campusops.seed.lab-speciality=false
campusops.seed.reduce-rooms=false
campusops.seed.assign-spaces-by-type=false

# ===== CORS (requis par SecurityConfig, sans valeur par defaut dans le code) =====
campusops.cors.allowed-origins=http://localhost:5173

# ===== URLs frontend (utilisees par les services d'e-mail) =====
campusops.app.login-url=http://localhost:5173/login
campusops.app.reset-password-url=http://localhost:5173/reset-password

# ===== Parametres de mail (requis par le contexte, meme si desactive) =====
campusops.mail.from=no-reply@campusops.ma
campusops.mail.reset-token-expiration-minutes=30
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# ===== Uploads =====
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ===== Pas de dependance externe sortante pendant les tests =====
campusops.mail.enabled=false

# ===== Ne pas lire de fichier de secrets local (absent en CI) =====
spring.config.import=
