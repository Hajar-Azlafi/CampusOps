# ============================================================================
#  CampusOps — configuration par defaut (VERSIONNEE)
#
#  Ce fichier est volontairement versionne dans Git : il ne doit contenir AUCUN
#  secret reel. Toutes les valeurs sensibles (mot de passe base, cle JWT, mots
#  de passe initiaux) sont lues depuis des variables d'environnement, avec des
#  valeurs de repli sures pour le developpement et la CI.
#
#  Ordre de priorite (du plus fort au plus faible) :
#    1. variables d'environnement (ex. DB_PASSWORD)
#    2. fichier local « secrets.properties » (ignore par Git)
#    3. valeurs par defaut definies ici
# ============================================================================
spring.application.name=campusops-backend
server.port=${SERVER_PORT:8080}

# ===== Fuseau horaire de l'application =====
# Fuseau de reference du PROCESSUS : gouverne l'horodatage des taches planifiees
# (rappels de reservation, bascule d'annee, bascule de semestre) et la
# serialisation JSON des dates. Fixe egalement le fuseau JVM au demarrage (voir
# CampusopsBackendApplication#main). DOIT rester coherent avec le fuseau par
# defaut de Parametres > Universite (defaut Africa/Casablanca), qui pilote, lui,
# l'affichage des dates et le jour des rappels a chaud. Surchargable via la
# variable d'environnement CAMPUSOPS_APP_TIMEZONE ou -Dcampusops.app.timezone.
campusops.app.timezone=${CAMPUSOPS_APP_TIMEZONE:Africa/Casablanca}
spring.jackson.time-zone=${campusops.app.timezone:Africa/Casablanca}

# Secrets locaux (identifiants SMTP...) : fichier OPTIONNEL a la racine du module
# backend, ignore par Git. Copier « secrets.properties.example » en
# « secrets.properties » et y mettre ses identifiants. Les variables
# d'environnement restent prioritaires sur ce fichier.
spring.config.import=optional:file:./secrets.properties

# ===== PostgreSQL =====
# En developpement local, la base tourne sur le port 5434 (cf. docker-compose).
# En Docker, DB_URL pointe vers le service « db » (jdbc:postgresql://db:5432/...).
# En CI, ces variables sont fournies par le job GitHub Actions.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/campusops_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — cle de repli UNIQUEMENT pour le developpement et les tests.
# En production, fournir JWT_SECRET (>= 256 bits, encode base64).
application.security.jwt.secret-key=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtcGxlYXNlLTI1Ni1iaXRzLW1pbg==}
application.security.jwt.expiration=86400000

# Encodage
spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'

# Admin par defaut
application.security.admin.email=${ADMIN_EMAIL:admin@campusops.ma}
application.security.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123}

# ===== Configuration SMTP (envoi d'e-mails) =====
# Les identifiants NE sont JAMAIS ecrits en dur ici. Ils sont lus, par ordre de
# priorite, depuis les variables d'environnement puis depuis le fichier local
# « secrets.properties » (importe juste au-dessus, ignore par Git).
#
# Profil par defaut : Gmail (smtp.gmail.com:587, STARTTLS + authentification).
#   MAIL_USERNAME = votre adresse Gmail complete
#   MAIL_PASSWORD = un « mot de passe d'application » Google de 16 caracteres
#                   (PAS le mot de passe du compte) : https://myaccount.google.com/apppasswords
#
# Pour basculer sur un serveur de test local (MailHog) sans toucher au code :
#   MAIL_HOST=localhost MAIL_PORT=1025 MAIL_SMTP_AUTH=false MAIL_SMTP_STARTTLS=false
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===== Parametres applicatifs des e-mails =====
# Adresse expediteur affichee dans les e-mails. Avec Gmail, l'expediteur DOIT
# etre l'adresse authentifiee : par defaut on reutilise donc MAIL_USERNAME.
campusops.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@campusops.ma}}
# Interrupteur global : passer a false pour desactiver l'envoi reel (les e-mails
# sont alors seulement journalises). Pratique pour les tests sans serveur SMTP.
campusops.mail.enabled=${MAIL_ENABLED:true}
# Duree de validite (minutes) d'un lien de reinitialisation de mot de passe.
campusops.mail.reset-token-expiration-minutes=${MAIL_RESET_TOKEN_MINUTES:30}
# URL cote frontend (React) vers laquelle pointent les liens des e-mails.
campusops.app.login-url=${APP_LOGIN_URL:http://localhost:5173/login}
campusops.app.reset-password-url=${APP_RESET_URL:http://localhost:5173/reset-password}
campusops.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===== Module 11 — Parametres et configuration de l'universite =====
# La configuration globale (nom, logo, couleurs, regles de reservation, horaires,
# securite, notifications, imports, affichage) vit en BASE dans la table
# « app_settings » (ligne unique) et se modifie depuis la page Parametres, sans
# toucher au code ni a ce fichier. Passer a false pour ne PAS creer la
# configuration par defaut au premier demarrage.
campusops.seed.settings=true

# Plafond ABSOLU du serveur pour un envoi de fichier. Il borne par le haut la
# « taille maximale » configurable dans Parametres > Imports : celle-ci ne peut
# pas depasser cette valeur, sinon un fichier accepte par l'application serait
# de toute facon rejete par Tomcat avant d'atteindre le controleur. Sans ces deux
# lignes, la limite par defaut de Spring Boot est de 1 Mo, en dessous des 5 Mo
# proposes par defaut a l'import.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Regles horaires des reservations : DEPLACEES en base (Module 11).
# L'heure d'ouverture, l'heure de fermeture, les jours ouvrables, l'heure limite
# de recherche et la duree minimale exploitable se modifient desormais depuis
# Parametres > Horaires et Parametres > Reservations. Elles ne sont plus lues
# ici : deux sources de verite se contrediraient des la premiere modification
# faite dans l'interface. Valeurs initiales inchangees (08:30 -> 18:00, lundi ->
# samedi, limite de recherche 18:30, minimum 30 min), voir SettingsInitializer.

# Durees proposees par le selecteur « duree souhaitee » du formulaire de
# recherche, en minutes (indicatif : toute valeur reste acceptee par l'API).
campusops.reservation.duration-options=60,90,120,180

# Referentiel Niveaux/Cycles + Filieres (petit jeu de donnees, 3 departements).
# La reconstruction s'execute AUTOMATIQUEMENT une seule fois au demarrage tant
# que la filiere temoin (code MAS-RSI) est absente : suppression FK-safe des
# donnees academiques (reservations, examens, emplois du temps, modules, groupes,
# promotions, filieres, semestres, niveaux) + RP herites, puis recreation des 3
# departements (Informatique, Mathematiques, Sciences Physiques) et des 11
# filieres. Les ESPACES et le compte ADMIN ne sont JAMAIS supprimes. Passer cette
# propriete a true force une nouvelle reconstruction meme si le referentiel est
# deja en place.
campusops.seed.reset-reference-data=false

# Structure academique idempotente au demarrage (semestres par cycle, promotions
# et groupes de l'annee active). true par defaut ; passer a false pour desactiver.
campusops.seed.academic-structure=true
# Nettoyage des anciens semestres generiques « Semestre N » sans niveau et non
# references par un emploi du temps (non destructif pour les semestres utilises).
campusops.seed.cleanup-legacy-semesters=true
# Supprime les anciens creneaux d'ordre 5 a 8 lorsqu'ils ne sont plus references.
campusops.seed.cleanup-legacy-time-slots=true
# Nombre de groupes initiaux crees PAR ANNEE de niveau et par filiere (configurable).
# Le nombre d'annees d'un niveau vient de Level.nombreAnnees (Tronc commun=2,
# Licence=1, Master=2, Cycle ingenieur=3) : on cree donc ce nombre de groupes
# pour CHAQUE annee (ex. Master => n groupes en 1re annee + n groupes en 2e annee),
# chaque groupe portant son annee de niveau (Group.anneeNiveau) pour l'import EDT.
campusops.seed.groups.tronc-commun=2
campusops.seed.groups.licence=2
campusops.seed.groups.master=1
campusops.seed.groups.cycle-ingenieur=2

# Passage a l'annee universitaire suivante.
# Methode SURE et non destructive : l'annee precedente et toute sa structure
# (promotions, groupes, emplois du temps, reservations) restent consultables.
# - Manuel : bouton admin / POST /api/academic-years/rollover (toujours disponible).
# - Automatique : DESACTIVE par defaut. Mettre a true pour activer une tache
#   planifiee qui bascule apres la date de fin de l'annee active.
campusops.academic-year.auto-rollover.enabled=false
# Frequence de verification de la tache automatique (cron Spring, 6 champs).
# Par defaut chaque jour a 03h00. Utilise uniquement si auto-rollover.enabled=true.
campusops.academic-year.auto-rollover.cron=0 0 3 * * *

# Bascule au semestre suivant (§20) — meme esprit que le passage d'annee.
# Modele « courant par niveau » : chaque niveau a AU PLUS un semestre courant ;
# la bascule fait avancer chaque courant au semestre suivant (S1->S2, S3->S4...)
# et archive les emplois du temps de l'annee active du semestre quitte (salles
# automatiquement liberees, cf. F1). Non destructif : rien n'est supprime.
# - Manuel : bouton admin / POST /api/semesters/rollover (toujours disponible).
# - Automatique : DESACTIVE par defaut.
campusops.semester.auto-rollover.enabled=false
# ATTENTION : contrairement au passage d'annee (garde par la date de fin), les
# semestres n'ont PAS de date : la tache planifiee bascule A CHAQUE declenchement.
# Le cron doit donc viser une date precise (une fois par an), et surtout pas une
# frequence quotidienne. Par defaut : 03h00 le 1er fevrier (enchaine S1->S2).
# Utilise uniquement si auto-rollover.enabled=true.
campusops.semester.auto-rollover.cron=0 0 3 1 2 *
# Amorcage du semestre courant : au demarrage, pose le semestre actif d'ordre le
# plus bas comme courant pour chaque niveau qui n'en a pas encore. Idempotent et
# non destructif. Passer a false pour gerer le courant uniquement a la main.
campusops.seed.semester-courant=true

# Comptes de demonstration « Responsable pedagogique » (hérité, Section 18).
# DESACTIVE par defaut : remplace par le seeder « un RP par filiere » ci-dessous.
# Vise d'anciens codes de filieres (MAS-ISI, MAS-GCMI, LIC-GC...) qui n'existent
# plus dans le petit jeu de donnees, et capturerait a tort les filieres de repli
# ING-GI / LIC-GI (il s'execute avant, @Order 10 < 11). Reactivable pour un
# referentiel hérité contenant encore ces anciens codes.
campusops.seed.responsables=false
# Un responsable pedagogique DEDIE par filiere (rp.<code>@campusops.ma), cree pour
# chaque filiere sans responsable. Idempotent (par e-mail) et non destructif (ne
# reattribue jamais une filiere deja pilotee). Source principale des comptes RP.
campusops.seed.responsables-per-filiere=true
# Mot de passe initial commun aux comptes responsables (démo + par filiere).
campusops.seed.responsables-password=${RESPONSABLES_PASSWORD:Responsable@123}

# Module « Emplois du temps ».
# Sessions universitaires de reference (« Session normale », « Session de
# rattrapage ») : indispensables car une session fait partie du contexte d'un
# emploi du temps (§1/§4). Generiques, sans nom d'etablissement (§26). Idempotent
# (reconnues par leur code) et non destructif. Passer a false pour ne rien creer.
campusops.seed.academic-sessions=true
# Emploi du temps de DEMONSTRATION (donnees d'exemple, §26) : cree un emploi du
# temps minimal et generique pour le premier groupe de l'annee active. DESACTIVE
# par defaut ; passer a true uniquement pour peupler un environnement de demo.
campusops.seed.timetables=false

# Modules d'enseignement du petit jeu de donnees (§6 & §9). Curriculum curate par
# filiere puis par ordre de semestre (coherent avec la discipline, jamais identique
# partout) ; filiere absente => petit pool transversal de secours. Idempotent
# (meme filiere + semestre + libelle jamais recree) et non destructif. @Order(13).
campusops.seed.modules=true

# Specialite des laboratoires / salles machines (§7). Retro-remplit la specialite
# des espaces LABORATORY et COMPUTER_ROOM existants dont la specialite est nulle,
# de facon deterministe (COMPUTER_ROOM => INFORMATIQUE/RESEAUX ; LABORATORY =>
# PHYSIQUE/CHIMIE/ELECTRICITE/ELECTRONIQUE/BIOLOGIE/MECANIQUE). Idempotent et
# non destructif : n'ecrase jamais une specialite deja definie, ne supprime aucun
# espace. @Order(14). Passer a false pour gerer les specialites uniquement a la main.
campusops.seed.lab-speciality=true

# Reduction du parc de salles (§ rarete) : supprime le batiment NB (etages +
# salles) et les amphitheatres autonomes surnumeraires (on conserve AMP1..AMP4 et
# l'amphi central AMPC). But : rendre la rarete des salles reelle pour que la
# recherche de disponibilite ait du sens. FK-safe, idempotent, @Order(12). Passer
# a false pour conserver toutes les salles.
campusops.seed.reduce-rooms=false

# Disable Spring DevTools automatic restart to avoid DevTools classloader issues during seeder execution
spring.devtools.restart.enabled=false
# Occupation des amphitheatres : place un cours magistral hebdomadaire dans chaque
# amphi conserve (jour/creneau distincts) pour creer une occupation realiste, sinon
# les amphis apparaitraient toujours libres. Statut PUBLIE, non destructif,
# idempotent (ignore si un amphi est deja occupe), @Order(13). Passer a false pour
# laisser les amphitheatres vides.
campusops.seed.assign-spaces-by-type=true
