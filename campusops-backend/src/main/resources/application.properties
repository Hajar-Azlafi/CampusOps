# Application
spring.application.name=campusops-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/campusops_db
spring.datasource.username=postgres
spring.datasource.password=1111
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (valeurs temporaires, on les utilisera a l'etape Securite)
application.security.jwt.secret-key=CHANGE_MOI_PLUS_TARD_AVEC_UNE_CLE_LONGUE_ET_ALEATOIRE_256_BITS
application.security.jwt.expiration=86400000

# Encodage
spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'