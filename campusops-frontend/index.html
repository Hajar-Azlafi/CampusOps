<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>campusops-frontend</title>
    <script>
      // Applique le thème mémorisé AVANT le premier rendu : sans cela, la page
      // s'afficherait en clair pendant un instant avant de passer en sombre.
      // Doit rester synchronisé avec src/context/ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem('campusops.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* stockage indisponible : thème clair par défaut */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
